<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>랜덤 번호 추첨기</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at top left, #233c63 0%, transparent 35%),
        radial-gradient(circle at bottom right, #281d45 0%, transparent 35%),
        #0d1b31;
    color: white;
    overflow-x: hidden;
}

/* =========================
   설정 화면
========================= */

#setupScreen {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.setupBox {
    width: 100%;
    max-width: 420px;

    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(18px);

    padding: 30px;
    border-radius: 22px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.1);

    animation: setupAppear .7s cubic-bezier(.16,1,.3,1);
}

.setupBox h1 {
    margin: 0 0 8px;
    text-align: center;
    font-size: 30px;
}

.setupBox p {
    margin: 0 0 25px;
    text-align: center;
    color: #b8c1d1;
}

.inputGroup {
    margin-bottom: 15px;
}

.inputGroup label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

.inputGroup input {
    width: 100%;
    padding: 14px;

    border: none;
    border-radius: 12px;

    outline: none;

    font-size: 17px;

    background: white;
    color: #111;

    transition:
        transform .2s,
        box-shadow .2s;
}

.inputGroup input:focus {
    transform: translateY(-2px);

    box-shadow:
        0 5px 20px rgba(255,255,255,.15);
}

#startGameBtn {
    width: 100%;

    margin-top: 8px;
    padding: 15px;

    border: none;
    border-radius: 12px;

    background: white;
    color: #111;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;

    transition:
        transform .2s,
        box-shadow .2s;
}

#startGameBtn:hover {
    transform: translateY(-2px);

    box-shadow:
        0 8px 25px rgba(255,255,255,.12);
}

#startGameBtn:active {
    transform: scale(.97);
}


/* =========================
   추첨 화면
========================= */

#gameScreen {
    display: none;
    min-height: 100vh;
    padding: 20px;

    animation: gameAppear .7s cubic-bezier(.16,1,.3,1);
}

.gameHeader {
    text-align: center;
    margin-bottom: 25px;
}

.gameHeader h1 {
    margin: 0;
    font-size: 28px;
}

.gameHeader p {
    margin-top: 8px;
    color: #aeb8c8;
}


/* =========================
   번호판
========================= */

.numberBoard {
    display: flex;
    flex-wrap: wrap;

    gap: 12px;

    align-items: flex-start;
}


/* =========================
   번호
========================= */

.number {
    width: 74px;
    height: 70px;

    border-radius: 20px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 25px;
    font-weight: bold;

    color: #102033;

    user-select: none;

    position: relative;

    transition:
        transform .25s cubic-bezier(.16,1,.3,1),
        filter .25s,
        box-shadow .25s;
}


/* 번호 등장 */

.number.show {
    animation:
        numberAppear .5s cubic-bezier(.16,1,.3,1) both;
}


/* 색상 */

.number:nth-child(7n + 1) {
    background: linear-gradient(135deg, #dca1ff, #eb7df2);
}

.number:nth-child(7n + 2) {
    background: linear-gradient(135deg, #ffb1d2, #f984ae);
}

.number:nth-child(7n + 3) {
    background: linear-gradient(135deg, #ffbea7, #f8a57e);
}

.number:nth-child(7n + 4) {
    background: linear-gradient(135deg, #f0f69e, #d8ed7b);
}

.number:nth-child(7n + 5) {
    background: linear-gradient(135deg, #b6f49e, #85f47d);
}

.number:nth-child(7n + 6) {
    background: linear-gradient(135deg, #9ff0d1, #7de9d6);
}

.number:nth-child(7n + 7) {
    background: linear-gradient(135deg, #a7ddff, #83b8f0);
}


/* 마우스 */

.number:hover:not(.picked) {
    transform: translateY(-4px) scale(1.03);

    box-shadow:
        0 10px 25px rgba(0,0,0,.2);
}


/* 현재 룰렛에서 선택되는 번호 */

.number.rolling {
    transform: scale(1.13);

    filter: brightness(1.22);

    box-shadow:
        0 0 0 4px rgba(255,255,255,.35),
        0 0 30px rgba(255,255,255,.5);

    z-index: 5;

    animation: rollingPulse .2s infinite alternate;
}


/* 최종 당첨 강조 */

.number.winner {
    animation:
        winnerPop .7s cubic-bezier(.16,1,.3,1);

    box-shadow:
        0 0 0 6px rgba(255,255,255,.4),
        0 0 45px rgba(255,255,255,.8);

    z-index: 10;
}


/* 뽑힌 번호 */

.number.picked {
    background:
        linear-gradient(135deg, #4b5260, #3d434e) !important;

    color: #9aa0ab;

    text-decoration: line-through;
    text-decoration-thickness: 4px;

    filter: brightness(.9);

    transform: scale(.98);

    box-shadow: none;

    animation: pickedAppear .4s ease;
}


/* =========================
   결과
========================= */

#pickedResult {
    margin-top: 20px;

    text-align: center;

    font-size: 20px;
    font-weight: bold;

    min-height: 28px;
}

#pickedResult.resultPop {
    animation: resultPop .5s cubic-bezier(.16,1,.3,1);
}


/* =========================
   버튼
========================= */

.bottomArea {
    display: flex;

    justify-content: center;

    margin-top: 30px;
}

#drawBtn {
    width: min(400px, 100%);

    padding: 17px;

    border: none;
    border-radius: 15px;

    background: white;
    color: #111;

    font-size: 19px;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 10px 30px rgba(0,0,0,.25);

    transition:
        transform .15s,
        box-shadow .2s;
}

#drawBtn:hover {
    transform: translateY(-3px);

    box-shadow:
        0 14px 35px rgba(0,0,0,.3);
}

#drawBtn:active {
    transform: scale(.95);
}

#drawBtn:disabled {
    opacity: .5;
    cursor: not-allowed;
}


/* =========================
   화면 효과
========================= */

body.drawFlash {
    animation: screenFlash .45s ease;
}


/* =========================
   애니메이션
========================= */

@keyframes setupAppear {

    from {
        opacity: 0;
        transform:
            translateY(25px)
            scale(.95);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }

}


@keyframes gameAppear {

    from {
        opacity: 0;
        transform:
            scale(.97)
            translateY(15px);
    }

    to {
        opacity: 1;
        transform:
            scale(1)
            translateY(0);
    }

}


@keyframes numberAppear {

    from {
        opacity: 0;
        transform:
            scale(.5)
            translateY(20px);
    }

    to {
        opacity: 1;
        transform:
            scale(1)
            translateY(0);
    }

}


@keyframes rollingPulse {

    from {
        transform: scale(1.10);
    }

    to {
        transform: scale(1.18);
    }

}


@keyframes winnerPop {

    0% {
        transform: scale(1);
    }

    35% {
        transform: scale(1.35) rotate(-4deg);
    }

    65% {
        transform: scale(1.15) rotate(4deg);
    }

    100% {
        transform: scale(1);
    }

}


@keyframes pickedAppear {

    from {
        opacity: .4;
        transform: scale(1.15);
    }

    to {
        opacity: 1;
        transform: scale(.98);
    }

}


@keyframes resultPop {

    0% {
        opacity: 0;
        transform: scale(.7);
    }

    70% {
        transform: scale(1.08);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }

}


@keyframes screenFlash {

    0% {
        filter: brightness(1);
    }

    35% {
        filter: brightness(1.35);
    }

    100% {
        filter: brightness(1);
    }

}


/* =========================
   모바일
========================= */

@media (max-width: 600px) {

    .number {
        width: calc(20% - 10px);
        height: 60px;

        font-size: 20px;

        border-radius: 15px;
    }

    .numberBoard {
        gap: 10px;
    }

    #gameScreen {
        padding: 15px;
    }

}
</style>
</head>

<body>


<!-- =========================
     설정 화면
========================= -->

<div id="setupScreen">

    <div class="setupBox">

        <h1>랜덤 번호 추첨기</h1>

        <p>
            추첨할 번호를 설정해주세요.
        </p>


        <div class="inputGroup">

            <label for="startNumber">
                시작번호
            </label>

            <input
                type="number"
                id="startNumber"
                placeholder="예: 1"
            >

        </div>


        <div class="inputGroup">

            <label for="endNumber">
                끝번호
            </label>

            <input
                type="number"
                id="endNumber"
                placeholder="예: 30"
            >

        </div>


        <div class="inputGroup">

            <label for="pickCount">
                한 번에 뽑을 개수
            </label>

            <input
                type="number"
                id="pickCount"
                placeholder="예: 1"
                min="1"
            >

        </div>


        <button id="startGameBtn">
            시작하기
        </button>

    </div>

</div>


<!-- =========================
     추첨 화면
========================= -->

<div id="gameScreen">

    <div class="gameHeader">

        <h1>
            랜덤 번호 추첨기
        </h1>

        <p id="infoText"></p>

    </div>


    <div
        id="numberBoard"
        class="numberBoard"
    ></div>


    <div id="pickedResult"></div>


    <div class="bottomArea">

        <button id="drawBtn">
            🎲 뽑기
        </button>

    </div>

</div>


<script>

const setupScreen =
    document.getElementById("setupScreen");

const gameScreen =
    document.getElementById("gameScreen");

const startNumberInput =
    document.getElementById("startNumber");

const endNumberInput =
    document.getElementById("endNumber");

const pickCountInput =
    document.getElementById("pickCount");

const startGameBtn =
    document.getElementById("startGameBtn");

const numberBoard =
    document.getElementById("numberBoard");

const drawBtn =
    document.getElementById("drawBtn");

const infoText =
    document.getElementById("infoText");

const pickedResult =
    document.getElementById("pickedResult");


let startNumber;
let endNumber;
let pickCount;

let availableNumbers = [];

let pickedNumbers = [];

let drawing = false;


/* =========================
   게임 시작
========================= */

startGameBtn.addEventListener(
    "click",
    startGame
);


function startGame() {

    startNumber =
        Number(startNumberInput.value);

    endNumber =
        Number(endNumberInput.value);

    pickCount =
        Number(pickCountInput.value);


    /* 입력 검사 */

    if (
        !Number.isInteger(startNumber) ||
        !Number.isInteger(endNumber) ||
        !Number.isInteger(pickCount)
    ) {

        alert("숫자를 모두 입력해주세요.");

        return;
    }


    if (startNumber > endNumber) {

        alert(
            "시작번호가 끝번호보다 클 수 없습니다."
        );

        return;
    }


    if (pickCount < 1) {

        alert(
            "뽑을 개수는 1 이상이어야 합니다."
        );

        return;
    }


    const totalNumbers =
        endNumber - startNumber + 1;


    if (pickCount > totalNumbers) {

        alert(
            "뽑을 수 있는 번호보다 개수가 많습니다."
        );

        return;
    }


    /* 번호 생성 */

    availableNumbers = [];

    pickedNumbers = [];


    for (
        let i = startNumber;
        i <= endNumber;
        i++
    ) {

        availableNumbers.push(i);

    }


    /* 번호판 초기화 */

    numberBoard.innerHTML = "";


    availableNumbers.forEach(
        (number, index) => {

            const div =
                document.createElement("div");

            div.className =
                "number";

            div.textContent =
                number;

            div.dataset.number =
                number;


            numberBoard.appendChild(div);


            /* 순차 등장 */

            setTimeout(
                () => {

                    div.classList.add(
                        "show"
                    );

                },
                index * 25
            );

        }
    );


    infoText.textContent =
        `${startNumber} ~ ${endNumber} · 한 번에 ${pickCount}개`;


    pickedResult.textContent = "";


    /* 화면 전환 */

    setupScreen.style.display =
        "none";

    gameScreen.style.display =
        "block";


    /* 약간의 등장 효과 */

    gameScreen.style.animation =
        "none";

    void gameScreen.offsetWidth;

    gameScreen.style.animation =
        "gameAppear .7s cubic-bezier(.16,1,.3,1)";

}


/* =========================
   추첨
========================= */

drawBtn.addEventListener(
    "click",
    drawNumbers
);


async function drawNumbers() {

    if (
        drawing ||
        availableNumbers.length === 0
    ) {

        return;

    }


    drawing = true;

    drawBtn.disabled = true;

    document.body.classList.add(
        "drawFlash"
    );


    /* 현재 번호들 */

    const numberElements =
        [...document.querySelectorAll(
            ".number:not(.picked)"
        )];


    /*
        빠르게 여러 번호를
        번쩍이는 효과
    */

    const rollingCount = 18;

    for (
        let i = 0;
        i < rollingCount;
        i++
    ) {

        if (
            numberElements.length === 0
        ) {
            break;
        }


        const randomElement =
            numberElements[
                Math.floor(
                    Math.random() *
                    numberElements.length
                )
            ];


        randomElement.classList.add(
            "rolling"
        );


        await wait(
            Math.max(
                35,
                100 - i * 4
            )
        );


        randomElement.classList.remove(
            "rolling"
        );

    }


    /* 실제 추첨 */

    const selectedNumbers = [];


    for (
        let i = 0;
        i < pickCount;
        i++
    ) {

        if (
            availableNumbers.length === 0
        ) {

            break;

        }


        const randomIndex =
            Math.floor(
                Math.random() *
                availableNumbers.length
            );


        const selected =
            availableNumbers.splice(
                randomIndex,
                1
            )[0];


        selectedNumbers.push(
            selected
        );

        pickedNumbers.push(
            selected
        );

    }


    /* 당첨 번호 애니메이션 */

    for (
        const number of selectedNumbers
    ) {

        const element =
            document.querySelector(
                `.number[data-number="${number}"]`
            );


        if (!element) {
            continue;
        }


        element.classList.add(
            "rolling"
        );

        element.classList.add(
            "winner"
        );


        await wait(450);


        element.classList.remove(
            "rolling"
        );


        element.classList.remove(
            "winner"
        );


        element.classList.add(
            "picked"
        );


        await wait(120);

    }


    /* 결과 */

    selectedNumbers.sort(
        (a, b) => a - b
    );


    pickedResult.textContent =
        `🎉 이번 추첨: ${selectedNumbers.join(", ")}`;


    pickedResult.classList.remove(
        "resultPop"
    );

    void pickedResult.offsetWidth;

    pickedResult.classList.add(
        "resultPop"
    );


    document.body.classList.remove(
        "drawFlash"
    );


    /* 종료 */

    if (
        availableNumbers.length === 0
    ) {

        drawBtn.disabled = true;

        drawBtn.textContent =
            "추첨 완료";

        pickedResult.textContent +=
            " · 모든 번호를 뽑았습니다!";

    } else {

        drawBtn.disabled = false;

    }


    drawing = false;

}


/* =========================
   딜레이
========================= */

function wait(ms) {

    return new Promise(
        resolve => setTimeout(
            resolve,
            ms
        )
    );

}

</script>

</body>
</html>
