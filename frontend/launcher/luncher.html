<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DaniTools</title>
    <link rel="stylesheet" href="./assets/style.css">
    <link rel="stylesheet" href="./assets/appruntip.css">
</head>

<body>
    <div id="desktop-files">현재 DaniTools는 베타 버전입니다. 백그라운드 이미지는 Openai의 이미지 생성 모델이 제작하였습니다.</div>
    <div id="desktop"></div>
    <div id="taskbar">
        <div id="search-wrapper">
            <span class="search-icon">🔍</span>
            <input id="app-search-input" type="search" placeholder="앱 검색" autocomplete="off" aria-label="앱 검색" />
            <div id="search-results" class="search-results" aria-label="검색 결과"></div>
        </div>
        <button class="taskbar-app" title="디데이" data-tooltip="디데이 계산기">
            📅
            <span class="running-indicator"></span>
        </button>
        <button class="taskbar-app" title="설정" data-tooltip="설정">
            ⚙️
            <span class="running-indicator"></span>
        </button>
        <button class="taskbar-app" title="타이머" data-tooltip="타이머">
            ⏱️
            <span class="running-indicator"></span>
        </button>
        <button class="taskbar-app" title="주사위 던지기" data-tooltip="주사위 던지기">
            🎲
            <span class="running-indicator"></span>
        </button>
        <button class="taskbar-app" title="랜덤 선택" data-tooltip="랜덤 선택">
            🎯
            <span class="running-indicator"></span>
        </button>
        <button class="taskbar-app" title="돌림판" data-tooltip="돌림판">
            🎡
            <span class="running-indicator"></span>
        </button>
        <button class="taskbar-app" title="점수판" data-tooltip="점수판">
            🏆
            <span class="running-indicator"></span>
        </button>
        <button class="taskbar-app" title="메모" data-tooltip="메모">
            📝
            <span class="running-indicator"></span>
        </button>
        <button class="taskbar-app" title="플레이어" data-tooltip="플레이어">
            ▶️
            <span class="running-indicator"></span>
        </button>
        <button class="taskbar-app" title="소음 측정기" data-tooltip="소음 측정기">
            🔊
            <span class="running-indicator"></span>
        </button>
        <button class="taskbar-app" title="QR 코드 생성기" data-tooltip="QR 코드 생성기">
            📱
            <span class="running-indicator"></span>
        </button>
        <button class="taskbar-app" title="실시간 시계" data-tooltip="실시간 시계">
            🕒
            <span class="running-indicator"></span>
        </button>
        <button class="taskbar-app" title="지구 라이브" data-tooltip="지구 라이브">
            🌍
            <span class="running-indicator"></span>
        </button>
        <button class="taskbar-app" title="체크리스트" data-tooltip="체크리스트">
            ✅
            <span class="running-indicator"></span>
        </button>
        <button class="taskbar-app" title="파일 암호화" data-tooltip="파일 암호화">
            🔒
            <span class="running-indicator"></span>
        </button>

        <div id="livetime">0000-00-00<br>
        오전 0:00</div>
    </div>


    <script src="./assets/script.js" defer></script>
</body>
</html>
