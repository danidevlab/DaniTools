name: Deno Multi-Job Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '릴리즈할 버전 (예: v1.0.0)'
        required: true
        type: string

jobs:
  # 1. 준비 단계 (수동 입력받은 버전 활용)
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.tag }}
    steps:
      - name: 버전 확인
        id: version
        run: |
          # 입력받은 버전 값 출력 및 확인
          VERSION="${{ inputs.version }}"
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "릴리즈 버전: $VERSION"

  # 2. 리눅스 빌드 단계
  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - run: deno compile --target x86_64-unknown-linux-gnu --allow-read --output my-app-linux main.ts
      - name: 파일 저장 (아티팩트)
        uses: actions/upload-artifact@v4
        with:
          name: linux-bin
          path: my-app-linux

  # 3. 윈도우 빌드 단계
  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - run: deno compile --target x86_64-pc-windows-msvc --allow-read --output my-app-windows.exe main.ts
      - name: 파일 저장 (아티팩트)
        uses: actions/upload-artifact@v4
        with:
          name: windows-bin
          path: my-app-windows.exe

  # 4. 릴리즈 단계
  release:
    needs: [prepare, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 빌드된 파일 가져오기
        uses: actions/download-artifact@v4

      - name: 깃허브 릴리즈 생성 및 업로드
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          files: |
            linux-bin/my-app-linux
            windows-bin/my-app-windows.exe
