name: Deno Multi-Job Release

on:
  push:
    tags:
      - "v*"

jobs:
  # 1. 준비 단계
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.tag }}
    steps:
      - name: 태그 이름 확인
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

  # 2. 리눅스 빌드 단계
  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - run: deno compile --target x86_64-unknown-linux-gnu --allow-read --output my-app-linux main.ts
      - name: 파일 저장 (아티팩트)
        uses: actions/upload-artifact@v4
        with:
          name: linux-bin
          path: my-app-linux

  # 3. 윈도우 빌드 단계
  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - run: deno compile --target x86_64-pc-windows-msvc --allow-read --output my-app-windows.exe main.ts
      - name: 파일 저장 (아티팩트)
        uses: actions/upload-artifact@v4
        with:
          name: windows-bin
          path: my-app-windows.exe

  # 4. 릴리즈 단계 (모든 빌드가 끝나면 실행)
  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 빌드된 파일 가져오기
        uses: actions/download-artifact@v4

      - name: 깃허브 릴리즈 생성 및 업로드
        uses: softprops/action-gh-release@v2
        with:
          files: |
            linux-bin/my-app-linux
            windows-bin/my-app-windows.exe
